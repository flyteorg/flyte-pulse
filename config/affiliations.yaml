# Company affiliations by GitHub username: one entry per person listing the
# companies their contributions are credited to.
#
# - A company without dates covers every day that no dated period covers; a person
#   can have one such company.
# - `from` is inclusive and `until` exclusive (UTC days). Use dates only when the
#   attribution period is known; they bound the credited contributions and are not
#   a claim about employment dates. Periods must not overlap.
# - `company` must be an `id` in companies.yaml, or `independent` for a period
#   with no company. Omit people with no known affiliation: INDEPENDENT is the
#   default.
# - Usernames are case-insensitive; `contributor_id: github:<numeric ID>` can
#   replace `username`, never both.
# - Supporting evidence belongs in the PR; merging it constitutes review.
# Example (comments only; replace placeholders before adding real entries):
# affiliations:
# - username: example-user
#   companies:
#   - company: union
#   - company: example-inc
#     from: '2024-01-01'
#     until: '2025-01-01'
#   - company: independent
#     from: '2025-01-01'
