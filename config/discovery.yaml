# Company discovery settings, maintained through PRs. The daily workflow proposes
# new companies, affiliations, and affiliation changes in a pull request; values
# listed here are never proposed again.
#
# profile_companies: exact public profile company values (case and repeated
#   whitespace ignored) that do not name an employer.
# organizations: GitHub organizations whose membership says nothing about an
#   employer, such as open source projects.
# domains: commit email domains that do not identify an employer.
# users: GitHub usernames whose affiliations are maintained by hand only.
ignore:
  profile_companies:
    - Student
    - Individual
    - Independent
    - Independent Consultant
    - Freelance
    - Freelancer
    - Self-employed
    - None
    - N/A
    # Several organizations at once; the employer is curated by hand.
    - '@Impact-Africa-Network @salarysasa @'
    - '@finbox-in, @creativecommons, @kmesh-net'
    - '@lyft @stripe @facebook'
    - '@microsoft @evenhealthcare @PeakBI @spdx @campus-experts'
    - '@nexpace-limited @toss @pubg'
    - '@p-to-q @scanapi @Spark-Lab-Global @Kyutefox'
    # Not an employer.
    - Neel
    - L3 Cybersecurity Engineer ▲
    # A project role, not an employer.
    - Maintainer @kedro
    # xAI, curated by hand; the profile adds a university.
    - xAI | BUAA
  organizations:
    - flyteorg
    # An open source project, not an employer.
    - kedro
  domains:
    # Personal committer addresses of the Apache Software Foundation.
    - apache.org
    # Project addresses, not employers.
    - flyte.org
    # A common misspelling of gmail.com.
    - gmai.com
    # Student and alumni addresses of the University of Michigan.
    - umich.edu
  users:
    # Works at Union (union.ai commit email); the profile still names a former employer.
    - k1sauce
    # The profile company field holds an email address.
    - aazam-gh
