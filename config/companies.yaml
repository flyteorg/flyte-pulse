# Canonical companies and exact public profile aliases, maintained through PRs.
# Alias matches are self-reported current affiliations, not employment dates.
# Seeded from official websites and the organizations' GitHub profiles.
# Multiple affiliations and unclear names stay unmapped unless individually reviewed.
# Add one canonical company per ID. website_url must be HTTPS. aliases are exact
# public GitHub profile-company values (case and repeated whitespace ignored),
# not GitHub usernames or email domains. canonical_name also matches as an alias.
# Use [] when there are no additional known aliases.
# Example:
# companies:
# - id: example-inc
#   canonical_name: Example Inc.
#   website_url: https://example.com
#   aliases:
#   - '@example-org'
#   - Example, Inc.
