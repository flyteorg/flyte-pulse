<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#08111f" />
    <title>Flyte Pulse</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="assets/dashboard.css" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <main class="shell" id="shell">
      <header class="top">
        <a class="brand brand-link" href="#/" aria-label="Flyte Pulse home"
          ><div class="mark">P</div
          ><div
            ><div class="eyebrow">Open source community</div><h1 class="title">Flyte Pulse</h1></div
          ></a
        >
        <div class="top-right"
          ><div class="stamp" id="page-stamp">Loading activity snapshot…</div></div
        >
      </header>
      <nav class="site-nav" id="site-nav" aria-label="Dashboard pages">
        <a href="#/">Overview</a>
        <a href="#/repositories">Repositories</a>
        <a href="#/users">Contributors</a>
        <a href="#/companies">Companies</a>
        <a href="#/ai-activity">AI Activity</a>
      </nav>
      <div class="error" id="error" role="alert"></div>
      <div class="page-loading-status" id="page-loading-status" hidden></div>
      <div id="page-content" aria-busy="true">
        <section class="panel page-section"
          ><div class="loading-state"
            ><span class="loading-indicator" role="status"
              ><span class="loading-spinner" aria-hidden="true"></span>Loading activity…</span
            ></div
          ></section
        >
      </div>
      <footer class="footer"
        ><span id="artifact-info">Reading published activity</span
        ><span>Source: GitHub activity · Git history</span></footer
      >
    </main>
    <template id="overview-template">
      <section class="filters" aria-label="Dashboard filters">
        <div class="field"
          ><label for="days">Time range</label
          ><select id="days"
            ><option value="7">Last 7 days</option
            ><option value="30" selected>Last 30 days</option
            ><option value="90">Last 90 days</option
            ><option value="365">Last 365 days</option
            ><option value="all">All available</option></select
          ></div
        >
        <div class="field repo"
          ><label for="repository">Repository</label
          ><select id="repository"
            ><option value="">All repositories</option></select
          ></div
        >
        <div class="spacer"></div><div class="status" id="status">Reading published activity</div>
      </section>
      <section class="cards" id="summary-cards" aria-label="Activity summary">
        <article class="card" style="--glow: #1d807b"
          ><div class="card-label">Active human contributors</div
          ><div class="card-value" id="contributors">—</div
          ><div class="card-note">GitHub identities classified as human</div></article
        >
        <article class="card" style="--glow: #5eae81"
          ><div class="card-label">New human contributors</div
          ><div class="card-value"
            ><a
              class="summary-link"
              id="new-contributors-link"
              href="#/users?days=30&amp;section=new-contributors"
              ><span id="new-contributors">—</span></a
            ></div
          ><div class="card-note">first recorded activity in selected range</div></article
        >
        <article class="card" style="--glow: #496dd0"
          ><div class="card-label">Pull requests merged</div
          ><div class="card-value" id="merged">—</div
          ><div class="card-note">merged in selected range</div></article
        >
        <article class="card" style="--glow: #1598a5"
          ><div class="card-label">Commits</div><div class="card-value" id="commits">—</div
          ><div class="card-note">associated with tracked pull requests</div></article
        >
        <article class="card" style="--glow: #b76f34"
          ><div class="card-label">Pull requests opened</div
          ><div class="card-value" id="opened">—</div
          ><div class="card-note">opened in selected range</div></article
        >
      </section>
      <section class="grid overview-grid">
        <article class="panel activity-panel">
          <div class="panel-head"
            ><div
              ><h2>Activity over time</h2
              ><div class="subtitle" id="chart-subtitle"
                >Daily merged PRs and commits across repositories, UTC</div
              ></div
            ><div class="legend"
              ><span><i class="dot"></i>Merged PRs</span
              ><span><i class="dot orange"></i>Commits</span></div
            ></div
          >
          <div class="async-section chart-region" id="chart-content">
            <svg
              class="chart"
              id="chart"
              role="img"
              aria-label="Daily merged pull requests and commits across repositories"
            ></svg>
            <div class="empty" id="chart-empty" hidden>No activity in this range.</div>
          </div>
        </article>
        <section class="panel contributors-panel">
          <div class="panel-head"
            ><div
              ><h2 id="contributors-heading">Top human contributors</h2
              ><div class="subtitle" id="contributors-subtitle"
                >Line changes are shared across the PR author and recognized co-authors</div
              ></div
            ><div class="contributor-toggle" role="group" aria-label="Contributor list"
              ><button type="button" data-contributor-kind="HUMAN" aria-pressed="true">Human</button
              ><button type="button" data-contributor-kind="NEW" aria-pressed="false">New</button
              ><button type="button" data-contributor-kind="AI" aria-pressed="false"
                >AI</button
              ></div
            ></div
          >
          <div class="search-control contributor-search"
            ><label id="contributors-search-label" for="contributors-search"
              >Search by username or name</label
            ><input
              id="contributors-search"
              type="search"
              placeholder="Username or full name"
              autocomplete="off" /><div
              class="subtitle"
              id="contributors-search-status"
              aria-live="polite"
            ></div
          ></div>
          <div class="table-wrap async-section" id="contributors-content"
            ><table
              ><thead
                ><tr id="contributors-columns"
                  ><th>Contributor</th><th class="num">Merged</th><th class="num">Commits</th
                  ><th class="num">Opened</th></tr
                ></thead
              ><tbody id="contributors-table"></tbody></table
            ><div class="empty" id="contributors-empty" hidden
              >No human contributor activity in this range.</div
            ></div
          >
        </section>
        <div class="overview-shares">
          <section class="panel repository-share-panel">
            <div class="panel-head"
              ><div
                ><h2>Repository share</h2
                ><div class="subtitle" id="repository-pie-subtitle"
                  >Merged pull requests by repository</div
                ></div
              >
              <div class="contributor-toggle" role="group" aria-label="Repository share metric"
                ><button type="button" data-pie-metric="pull_requests_merged" aria-pressed="true"
                  >Merged PRs</button
                ><button type="button" data-pie-metric="commits" aria-pressed="false"
                  >Commits</button
                ></div
              >
            </div>
            <div class="async-section repository-share-region" id="repository-pie-content">
              <div class="repository-pie-layout"
                ><svg
                  class="repository-pie"
                  id="repository-pie"
                  viewBox="0 0 200 200"
                  role="img"
                  aria-label="Repository share pie chart"
                ></svg
                ><ul class="repository-pie-legend" id="repository-pie-legend"></ul
              ></div>
              <div class="empty" id="repository-pie-empty" hidden
                >No repository activity in this range.</div
              >
            </div>
          </section>
          <section class="panel repository-share-panel">
            <div class="panel-head"
              ><div
                ><h2>Contributions by company</h2
                ><div class="subtitle" id="company-pie-subtitle"
                  >Shared merged PR credits by company</div
                ></div
              >
              <div class="contributor-toggle" role="group" aria-label="Company contribution metric"
                ><button
                  type="button"
                  data-company-pie-metric="pull_requests_merged"
                  aria-pressed="true"
                  >Merged PRs</button
                ><button type="button" data-company-pie-metric="commits" aria-pressed="false"
                  >Commits</button
                ></div
              >
            </div>
            <div class="async-section repository-share-region" id="company-pie-content">
              <div class="repository-pie-layout"
                ><svg
                  class="repository-pie"
                  id="company-pie"
                  viewBox="0 0 200 200"
                  role="img"
                  aria-label="Contributions by company pie chart"
                ></svg
                ><ul class="repository-pie-legend" id="company-pie-legend"></ul
              ></div>
              <div class="empty" id="company-pie-empty" hidden
                >No company activity in this range.</div
              >
            </div>
            <p class="subtitle"
              >Each contribution counts once for every credited company. Undated mappings cover all
              recorded activity unless a dated period overrides them. Without a known affiliation,
              contributions count as Independent.</p
            >
          </section>
        </div>
      </section>
      <section class="grid repository-overview-grid">
        <section class="panel repository-table-panel"
          ><div class="panel-head"
            ><div
              ><h2>Repository activity</h2
              ><div class="subtitle"
                >Merged PR line changes counted once per repository; contributor counts are shared
                and overlap.</div
              ></div
            ></div
          ><div class="table-wrap async-section" id="repositories-content"
            ><table
              ><thead
                ><tr
                  ><th>Repository</th><th class="num">Merged PRs</th><th class="num">Commits</th
                  ><th class="num">Opened PRs</th><th class="num">Lines added / removed</th></tr
                ></thead
              ><tbody id="repositories-table"></tbody></table
            ><div class="empty" id="repositories-empty" hidden
              >No repository activity in this range.</div
            ></div
          ></section
        >
      </section>
    </template>
  </body>
</html>
