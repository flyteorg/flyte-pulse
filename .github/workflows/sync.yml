# Daily: collect new activity (Git clones + GitHub GraphQL), save the state to the
# `data` branch and the `pulse-state` release, rebuild and deploy the site, and
# propose company and affiliation updates in a pull request.
# Pushes to main rebuild and deploy the site from the saved state without syncing.
name: Sync and deploy

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      sync:
        description: Collect new activity before deploying
        type: boolean
        default: true
      reseed:
        description: Repositories to collect again from scratch (space-separated owner/name)
        type: string
        default: ""
      history_days:
        description: PR history for repositories without a scan cursor (0 = all)
        type: string
        default: "0"
      full_git:
        description: Re-read the full Git history of every repository (backfills commit fields)
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "web/**"
      - "config/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/sync.yml"

permissions:
  contents: read

concurrency:
  group: pulse-sync
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  STATE_RELEASE: pulse-state
  DATA_BRANCH: data

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      # Commit the state to the data branch, replace the release asset, and push the
      # company discovery branch.
      contents: write
      # Open the company discovery pull request and comment on it.
      pull-requests: write
      # Start CI for the discovery pull request branch.
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out the data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$remote" "$DATA_BRANCH" >/dev/null; then
            git clone --quiet --depth 1 --branch "$DATA_BRANCH" --single-branch "$remote" data-branch
          else
            git init --quiet -b "$DATA_BRANCH" data-branch
            git -C data-branch remote add origin "$remote"
          fi
          if [ -f data-branch/state/manifest.json ]; then
            echo "STATE=data-branch/state" >> "$GITHUB_ENV"
          elif gh release download "$STATE_RELEASE" --pattern pulse-state.json.gz --dir . 2>/dev/null; then
            echo "STATE=pulse-state.json.gz" >> "$GITHUB_ENV"
          else
            echo "::error::No saved state on the $DATA_BRANCH branch or the $STATE_RELEASE release; seed it first (see README)."
            exit 1
          fi

      # Installs the toolchain and targets from rust-toolchain.toml and caches builds.
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          # CI enforces warnings; a warning must not stop the daily data refresh.
          build-warnings: warn
      - name: Read the wasm-bindgen version
        id: versions
        # The CLI must match the wasm-bindgen crate, which Dependabot updates.
        run: echo "wasm_bindgen=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/"/, "", $3); print $3 }' Cargo.lock)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: wasm-bindgen@${{ steps.versions.outputs.wasm_bindgen }}
      - name: Install wasm-opt
        run: sudo apt-get install -y --no-install-recommends binaryen

      - name: Build the collector
        run: cargo build --release -p pulse

      - name: Sync
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.sync)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Optional personal access token with a higher rate limit, for reseeds.
          PULSE_GITHUB_TOKEN: ${{ secrets.PULSE_GITHUB_TOKEN }}
          RESEED: ${{ inputs.reseed }}
          HISTORY_DAYS: ${{ inputs.history_days || '0' }}
          FULL_GIT: ${{ inputs.full_git }}
        run: |
          args=(--state "$STATE" --out data-branch/state --config-dir config --history-days "$HISTORY_DAYS"
            --summary-file "$GITHUB_STEP_SUMMARY")
          for repository in $RESEED; do args+=(--reseed "$repository"); done
          if [ "$FULL_GIT" = "true" ]; then args+=(--full-git); fi
          ./target/release/pulse sync "${args[@]}"
          echo "STATE=data-branch/state" >> "$GITHUB_ENV"
          echo "SYNCED=true" >> "$GITHUB_ENV"

      - name: Save state to the data branch
        if: env.SYNCED == 'true'
        working-directory: data-branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state
          if git diff --cached --quiet; then
            echo "State unchanged"
          else
            git commit --quiet -m "Sync $(date -u +%Y-%m-%dT%H:%MZ)"
            git push --quiet origin "HEAD:$DATA_BRANCH"
          fi

      - name: Publish state release asset
        if: env.SYNCED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./target/release/pulse convert --from data-branch/state --to pulse-state.json.gz
          if ! gh release view "$STATE_RELEASE" >/dev/null 2>&1; then
            gh release create "$STATE_RELEASE" --title "Pulse state" --latest=false \
              --notes "Collected Flyte Pulse state, replaced by every sync. The data branch keeps its history."
          fi
          gh release upload "$STATE_RELEASE" pulse-state.json.gz --clobber

      - name: Build the site
        run: scripts/build-site.sh "$STATE" dist

      - name: Report the site data
        run: ./target/release/pulse summary --data dist/data --summary-file "$GITHUB_STEP_SUMMARY"

      # After the site build, so the published site never includes unreviewed proposals.
      - name: Propose company and affiliation updates
        if: env.SYNCED == 'true'
        # Proposals are optional; a problem here must not block the deploy.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PULSE_GITHUB_TOKEN: ${{ secrets.PULSE_GITHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          # Optional user token with Copilot access, so Copilot acts on the review request.
          COPILOT_TOKEN: ${{ secrets.PULSE_COPILOT_TOKEN }}
        run: |
          ./target/release/pulse discover --state data-branch/state --config-dir config --apply \
            --report discovery.md --summary-file "$GITHUB_STEP_SUMMARY"
          scripts/discovery-pr.sh discovery.md

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
